<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Optimized Leaderboard</title>
</head>
<body>
    <form onsubmit="addExpense(event)">
        <label for="username">Your Name:</label>
        <input type="text" id="username" placeholder="Enter your name" required>
        <br><br>

        <label for="expenseamount">Choose expenseamount:</label>
        <input type="number" id="expenseamount" required>
        <br><br>
        
        <label for="description">Choose description:</label>
        <input type="text" id="description" required>
        <br><br>
        
        <label for="category">Choose a category:</label>
        <select id="category">
            <option value="fuel">fuel</option>
            <option value="food">food</option>
            <option value="movie">movie</option>
            <option value="electricity">electricity</option>
        </select>
        <br><br>
        
        <button type="submit">Add Expense</button>
    </form>

    <div id="message" style="margin-top: 20px;">You are a premium user</div>
    <br>
    <button id="showLeaderboard" onclick="showLeaderboard()">Show Leaderboard</button>

    <h2>Expenses</h2>
    <ul id="leaderboardList"></ul>

    <script src="leaderBoard.js"></script>
</body>
</html>
